services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: contractscout_hw
    volumes:
      - hw-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d contractscout_hw"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://scout:scout@db:5432/contractscout_hw
      CORS_ORIGINS: "*"
      JWT_SECRET: change-me-local
      ADMIN_EMAIL: gwa26@bk.ru
      ADMIN_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - internal

volumes:
  hw-pg:

networks:
  internal:
    driver: bridge
